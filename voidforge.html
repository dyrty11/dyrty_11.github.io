<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⬡ VoidForge — Генератор Сайтов</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src data: blob:; frame-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none';">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --surface: #0a0a0a; --border: #333; --text: #fff; --text-muted: #888; --accent: #ccff00; }
        * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }
        body { font-family: 'IBM Plex Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 800px; background: var(--surface); border: 1px solid var(--border); padding: 40px; }
        .header { text-align: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        .header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.5em; font-weight: 700; text-transform: uppercase; letter-spacing: -2px; color: var(--text); }
        .header h1 span { color: var(--accent); }
        .header .subtitle { font-size: 0.8em; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-top: 5px; }
        .section { margin-bottom: 25px; }
        .section-title { font-size: 0.8em; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 10px; }
        .section-title::before { content: '> '; color: var(--accent); }
        .file-upload-area {
            padding: 30px; text-align: center; cursor: pointer; transition: all 0.2s;
            background: var(--bg); border: none; position: relative;
        }
        .file-upload-area::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background-image:
                linear-gradient(90deg, var(--border) 50%, transparent 50%),
                linear-gradient(90deg, var(--border) 50%, transparent 50%),
                linear-gradient(0deg,  var(--border) 50%, transparent 50%),
                linear-gradient(0deg,  var(--border) 50%, transparent 50%);
            background-repeat: repeat-x, repeat-x, repeat-y, repeat-y;
            background-size: 12px 1px, 12px 1px, 1px 12px, 1px 12px;
            background-position: 0 0, 0 100%, 0 0, 100% 0;
            animation: borderMarch 0.8s linear infinite;
        }
        .file-upload-area:hover::after {
            background-image:
                linear-gradient(90deg, var(--accent) 50%, transparent 50%),
                linear-gradient(90deg, var(--accent) 50%, transparent 50%),
                linear-gradient(0deg,  var(--accent) 50%, transparent 50%),
                linear-gradient(0deg,  var(--accent) 50%, transparent 50%);
        }
        @keyframes borderMarch {
            from { background-position: 0 0,      0 100%,    0 0,      100% 0; }
            to   { background-position: 12px 0,  -12px 100%, 0 -12px,  100% 12px; }
        }
        .file-upload-area .upload-icon { font-size: 24px; display: block; margin-bottom: 10px; }
        .file-upload-area .upload-text { font-size: 0.9em; color: var(--text-muted); }
        .file-upload-area .file-name { font-size: 0.8em; color: var(--accent); margin-top: 10px; word-break: break-all; }
        input[type="file"] { display: none; }
        .preview-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .preview-mini { border: 1px solid var(--border); padding: 15px; text-align: center; background: var(--bg); }
        .preview-mini .mini-label { font-size: 0.7em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
        .preview-mini img { max-width: 100%; max-height: 80px; object-fit: contain; }
        .preview-mini .no-preview { color: var(--border); font-size: 2em; }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { flex: 1; padding: 15px; border: 1px solid var(--border); background: transparent; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 0.9em; font-weight: 500; text-transform: uppercase; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-generate { background: var(--accent); color: #000; border-color: var(--accent); }
        .btn-generate:hover:not(:disabled) { background: #aadd00; color: #000; }
        .btn-download, .btn-preview { display: none; }
        .btn-download.visible, .btn-preview.visible { display: flex; }
        .generated-info { display: none; margin-top: 20px; padding: 15px; border: 1px solid var(--accent); color: var(--accent); font-size: 0.9em; text-align: center; text-transform: uppercase; }
        .generated-info.visible { display: block; }
        .preview-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; flex-direction: column; padding: 20px; }
        .preview-modal-header { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .preview-modal-close { background: var(--accent); color: #000; border: none; padding: 10px 20px; font-family: 'IBM Plex Mono', monospace; font-weight: bold; text-transform: uppercase; cursor: pointer; }
        .preview-modal iframe { width: 100%; height: 100%; border: 1px solid var(--border); background: #000; }
        @media (max-width: 600px) { .container { padding: 20px; } .preview-row { grid-template-columns: 1fr; } .btn-row { flex-direction: column; } .header h1 { font-size: 1.8em; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Void<span>Forge</span></h1>
            <p class="subtitle">Генератор Soundtag Сайтов</p>
        </div>
        <div class="section">
            <div class="section-title">Изображение (JPEG, PNG, GIF, WebP)</div>
            <div class="file-upload-area" id="imageDropZone">
                <span class="upload-icon">🖼️</span>
                <span class="upload-text">Перетащите или нажмите для выбора</span>
                <span class="file-name" id="imageFileName">Не выбрано</span>
            </div>
            <input type="file" id="imageInput" accept="image/jpeg, image/png, image/gif, image/webp">
        </div>
        <div class="section">
            <div class="section-title">Аудио (MP3, OGG, WAV, M4A)</div>
            <div class="file-upload-area" id="audioDropZone">
                <span class="upload-icon">🎧</span>
                <span class="upload-text">Перетащите или нажмите для выбора</span>
                <span class="file-name" id="audioFileName">Не выбрано</span>
            </div>
            <input type="file" id="audioInput" accept="audio/mpeg, audio/ogg, audio/wav, audio/x-m4a, audio/mp4">
        </div>
        <div class="preview-row">
            <div class="preview-mini">
                <div class="mini-label">Превью изображения</div>
                <img id="imagePreview" src="" alt="" style="display:none;">
                <div class="no-preview" id="noImagePreview">—</div>
            </div>
            <div class="preview-mini">
                <div class="mini-label">Статус аудио</div>
                <div style="padding:10px 0;"><span id="audioStatus" style="font-size:0.8em;color:var(--text-muted);">Ожидание</span></div>
            </div>
        </div>
        <div class="btn-row">
            <button class="btn btn-generate" id="btnGenerate">⚡ Сгенерировать</button>
            <button class="btn btn-download" id="btnDownload">⬇ Скачать</button>
            <button class="btn btn-preview" id="btnPreview">◉ Предпросмотр</button>
        </div>
        <div class="generated-info" id="generatedInfo">✓ Сайт готов! Файл сохранится как <span style="font-weight:bold;">index.html</span></div>
    </div>
    <script src="voidforge.js" defer></script>
</body>
</html>
