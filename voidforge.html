<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⬡ VoidForge — Генератор Сайтов</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src data: blob:; frame-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none';">
    <script src="frame-bust.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="voidforge.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Void<span>Forge</span></h1>
            <p class="subtitle">Генератор Soundtag Сайтов</p>
        </div>
        <div class="section">
            <div class="section-title">Изображение (JPEG, PNG, GIF, WebP)</div>
            <div class="file-upload-area" id="imageDropZone">
                <span class="upload-icon">🖼️</span>
                <span class="upload-text">Перетащите или нажмите для выбора</span>
                <span class="file-name" id="imageFileName">Не выбрано</span>
            </div>
            <input type="file" id="imageInput" accept="image/jpeg, image/png, image/gif, image/webp">
        </div>
        <div class="section">
            <div class="section-title">Аудио (MP3, OGG, WAV, M4A)</div>
            <div class="file-upload-area" id="audioDropZone">
                <span class="upload-icon">🎧</span>
                <span class="upload-text">Перетащите или нажмите для выбора</span>
                <span class="file-name" id="audioFileName">Не выбрано</span>
            </div>
            <input type="file" id="audioInput" accept="audio/mpeg, audio/ogg, audio/wav, audio/x-m4a, audio/mp4">
        </div>
        <div class="preview-row">
            <div class="preview-mini">
                <div class="mini-label">Превью изображения</div>
                <img id="imagePreview" src="" alt="" style="display:none;">
                <div class="no-preview" id="noImagePreview">—</div>
            </div>
            <div class="preview-mini">
                <div class="mini-label">Статус аудио</div>
                <div style="padding:10px 0;"><span id="audioStatus" style="font-size:0.8em;color:var(--text-muted);">Ожидание</span></div>
            </div>
        </div>
        <div class="btn-row">
            <button class="btn btn-generate" id="btnGenerate">⚡ Сгенерировать</button>
            <button class="btn btn-download" id="btnDownload">⬇ Скачать</button>
            <button class="btn btn-preview" id="btnPreview">◉ Предпросмотр</button>
        </div>
        <div class="generated-info" id="generatedInfo">✓ Сайт готов! Файл сохранится как <span style="font-weight:bold;">index.html</span></div>
    </div>
    <script src="voidforge.js" defer></script>
</body>
</html>
