<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <style>
        .bg     { fill: #050505; }
        .stroke { stroke: #ccff00; }
        .dot    { fill: #ccff00; }
        
        /* Светлая тема браузера */
        @media (prefers-color-scheme: light) {
            .bg     { fill: #ffffff; }
            .stroke { stroke: #050505; }
            .dot    { fill: #88cc00; }
        }
    </style>
    
    <rect class="bg" width="100" height="100"/>
    <polygon class="stroke" points="50,12 83,31 83,69 50,88 17,69 17,31" fill="none" stroke-width="6" stroke-linejoin="miter"/>
        <circle cx="50" cy="50" r="10" fill="var(--accent)"/>
</svg>