<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter — P.</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'none'; form-action 'none';">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --surface: #0a0a0a; --border: #333; --text: #fff; --text-muted: #888; --accent: #ccff00; }
        * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }
        body { font-family: 'IBM Plex Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 1000px; background: var(--surface); border: 1px solid var(--border); padding: 40px; }
        .header { margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.5em; text-transform: uppercase; letter-spacing: -1px; }
        h1 span { color: var(--accent); }
        .subtitle { color: var(--text-muted); font-size: 0.9em; margin-top: 5px; }
        .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .panel { display: flex; flex-direction: column; gap: 10px; }
        .panel-header { font-size: 0.8em; text-transform: uppercase; color: var(--text-muted); display: flex; justify-content: space-between; }
        textarea { width: 100%; height: 400px; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 15px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; resize: none; outline: none; transition: border-color 0.2s; }
        textarea:focus { border-color: var(--accent); }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { flex: 1; padding: 12px; background: transparent; border: 1px solid var(--border); color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
        .btn-primary:hover { opacity: 0.8; color: #000; }
        .status { font-size: 0.85em; margin-top: 10px; text-transform: uppercase; font-weight: bold; }
        .status.error { color: #ff3333; }
        .status.success { color: var(--accent); }
        .back-link { display: inline-block; margin-top: 30px; color: var(--text-muted); text-decoration: none; font-size: 14px; text-transform: uppercase; }
        .back-link:hover { color: var(--accent); }
        @media (max-width: 768px) { .editor-grid { grid-template-columns: 1fr; } .container { padding: 20px; } h1 { font-size: 2em; } textarea { height: 250px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>JSON <span>Formatter</span></h1>
            <p class="subtitle">Валидация, форматирование и минификация JSON в браузере.</p>
        </div>
        <div class="editor-grid">
            <div class="panel">
                <div class="panel-header"><span>Ввод (Raw JSON)</span></div>
                <textarea id="inputArea" placeholder='{"example": "Вставьте сюда ваш JSON..."}'></textarea>
            </div>
            <div class="panel">
                <div class="panel-header"><span>Результат</span></div>
                <textarea id="outputArea" readonly placeholder="Здесь появится результат..."></textarea>
            </div>
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" id="formatBtn">Форматировать</button>
            <button class="btn" id="minifyBtn">Сжать (Minify)</button>
            <button class="btn" id="copyBtn">Копировать</button>
            <button class="btn" id="clearBtn">Очистить</button>
        </div>
        <div class="status" id="status"></div>
        <a href="index.html" class="back-link">← Назад в портфолио</a>
    </div>
    <script>
        (function() {
            const inputArea = document.getElementById('inputArea'); const outputArea = document.getElementById('outputArea');
            const formatBtn = document.getElementById('formatBtn'); const minifyBtn = document.getElementById('minifyBtn');
            const copyBtn = document.getElementById('copyBtn'); const clearBtn = document.getElementById('clearBtn'); const status = document.getElementById('status');
            function showStatus(message, type) { status.textContent = message; status.className = 'status ' + type; }
            function clearStatus() { status.textContent = ''; status.className = 'status'; }
            function processJSON(minify = false) {
                const raw = inputArea.value.trim();
                if (!raw) { showStatus('Введите JSON для обработки.', 'error'); return; }
                try {
                    const parsed = JSON.parse(raw);
                    let result;
                    if (minify) { result = JSON.stringify(parsed); showStatus('Успешно сжато!', 'success'); }
                    else { result = JSON.stringify(parsed, null, 4); showStatus('Успешно отформатировано!', 'success'); }
                    outputArea.value = result;
                } catch (error) { outputArea.value = ''; showStatus('Ошибка: ' + error.message, 'error'); }
            }
            formatBtn.addEventListener('click', () => processJSON(false));
            minifyBtn.addEventListener('click', () => processJSON(true));
            copyBtn.addEventListener('click', () => {
                if (!outputArea.value) { showStatus('Нечего копировать.', 'error'); return; }
                navigator.clipboard.writeText(outputArea.value).then(() => { showStatus('Скопировано в буфер обмена!', 'success'); setTimeout(clearStatus, 2000); }).catch(() => { showStatus('Не удалось скопировать.', 'error'); });
            });
            clearBtn.addEventListener('click', () => { inputArea.value = ''; outputArea.value = ''; clearStatus(); });
        })();
    </script>
</body>
</html>
