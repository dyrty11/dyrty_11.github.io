<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter — P.</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none';">
    <script src="frame-bust.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="json-formatter.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>JSON <span>Formatter</span></h1>
            <p class="subtitle">Валидация, форматирование и минификация JSON в браузере.</p>
        </div>
        <div class="editor-grid">
            <div class="panel">
                <div class="panel-header"><span>Ввод (Raw JSON)</span></div>
                <textarea id="inputArea" placeholder="{&#10;  &quot;name&quot;: &quot;Иван&quot;,&#10;  &quot;age&quot;: 30&#10;}"></textarea>
            </div>
            <div class="panel">
                <div class="panel-header"><span>Результат</span></div>
                <textarea id="outputArea" readonly placeholder="Здесь появится результат..."></textarea>
            </div>
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" id="formatBtn">Форматировать</button>
            <button class="btn" id="minifyBtn">Сжать (Minify)</button>
            <button class="btn" id="copyBtn">Копировать</button>
            <button class="btn" id="clearBtn">Очистить</button>
        </div>
        <div class="status" id="status"></div>
        <a href="index.html" class="back-link">← Назад в портфолио</a>
    </div>
    <script src="json-formatter.js" defer></script>
</body>
</html>
