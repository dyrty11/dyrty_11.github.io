<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page not found</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none';">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Абсолютный путь, так как 404 может открыться на любом /a/b/c -->
    <script src="/dyrty_11.github.io/theme-init.js"></script>
    
    <style>
        :root {
            --bg: #050505; --surface: #0a0a0a; --border: #333;
            --text: #fff; --text-muted: #888; --accent: #ccff00;
        }
        [data-theme="light"] {
            --bg: #f4f4f4; --surface: #ffffff; --border: #d4d4d4;
            --text: #050505; --text-muted: #555555; --accent: #ccff00;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }
        body {
            font-family: 'IBM Plex Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s, color 0.3s;
        }
        
        .animated-dashed { position: relative; border: none !important; }
        .animated-dashed::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background-image:
                linear-gradient(90deg, var(--border) 50%, transparent 50%),
                linear-gradient(90deg, var(--border) 50%, transparent 50%),
                linear-gradient(0deg,  var(--border) 50%, transparent 50%),
                linear-gradient(0deg,  var(--border) 50%, transparent 50%);
            background-repeat: repeat-x, repeat-x, repeat-y, repeat-y;
            background-size:   12px 1px, 12px 1px, 1px 12px, 1px 12px;
            background-position: 0 0, 0 100%, 0 0, 100% 0;
            animation: borderMarch 0.8s linear infinite;
        }
        .animated-dashed:hover::after {
            background-image:
                linear-gradient(90deg, var(--accent) 50%, transparent 50%),
                linear-gradient(90deg, var(--accent) 50%, transparent 50%),
                linear-gradient(0deg,  var(--accent) 50%, transparent 50%),
                linear-gradient(0deg,  var(--accent) 50%, transparent 50%);
        }
        @keyframes borderMarch {
            from { background-position: 0 0, 0 100%, 0 0, 100% 0; }
            to   { background-position: 12px 0, -12px 100%, 0 -12px, 100% 12px; }
        }

        .wrapper {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 40px 20px; text-align: center;
        }

        .error-code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(120px, 25vw, 280px);
            font-weight: 700; line-height: 0.85; letter-spacing: -8px;
            color: transparent; -webkit-text-stroke: 2px var(--text);
            position: relative; user-select: none; margin-bottom: 20px;
        }
        .error-code span { color: var(--accent); -webkit-text-stroke: 0; }
        .error-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(20px, 3vw, 32px);
            font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 15px;
        }
        .error-desc {
            font-size: 14px; color: var(--text-muted);
            max-width: 480px; line-height: 1.6; margin-bottom: 40px;
        }
        
        .error-nav { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 50px; }
        .btn {
            font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500;
            text-transform: uppercase; padding: 16px 32px; border: 1px solid var(--border);
            background: transparent; color: var(--text); cursor: pointer;
            text-decoration: none; transition: all 0.2s;
        }
        .btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }
        .btn-primary { border-color: var(--accent); color: var(--accent); }
        .btn-primary:hover { background: var(--accent); color: #000; }

        .error-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 1px; background: var(--border); border: 1px solid var(--border);
            max-width: 600px; width: 100%;
        }
        .error-grid a {
            display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
            padding: 25px; background: var(--surface); color: var(--text);
            text-decoration: none; transition: background 0.2s;
        }
        .error-grid a:hover { background: var(--bg); }
        .grid-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        .grid-path { font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: var(--accent); }
        
        .error-hint { margin-top: 40px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }
        
        .theme-toggle-wrap { position: absolute; top: 20px; right: 20px; }
        .theme-switch {
            width: 50px; height: 26px; background: var(--bg); border: 1px solid var(--border);
            cursor: pointer; display: flex; align-items: center; position: relative; padding: 2px;
        }
        .theme-switch svg { width: 14px; height: 14px; fill: var(--text-muted); transition: all 0.3s; }
        .theme-switch .sun-icon { position: absolute; left: 4px; }
        .theme-switch .moon-icon { position: absolute; right: 4px; }
        .theme-switch-ball {
            width: 20px; height: 20px; background: var(--accent);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        [data-theme="dark"] .theme-switch-ball { transform: translateX(24px); }
        [data-theme="light"] .theme-switch-ball { transform: translateX(0); }
        [data-theme="dark"] .theme-switch .moon-icon { fill: #000; }
        [data-theme="light"] .theme-switch .sun-icon { fill: #000; }

        @media (max-width: 600px) {
            .error-code { letter-spacing: -4px; margin-bottom: 10px; }
            .error-grid { grid-template-columns: 1fr; }
            .btn { width: 100%; text-align: center; padding: 14px 20px; }
            .theme-toggle-wrap { top: 15px; right: 15px; }
        }
    </style>
</head>
<body>
    <div class="theme-toggle-wrap">
        <div class="theme-switch" id="themeToggle">
            <div class="theme-switch-ball"></div>
            <svg class="sun-icon" viewBox="0 0 24 24"><path d="M12 18C8.686 18 6 15.314 6 12C6 8.686 8.686 6 12 6C15.314 6 18 8.686 18 12C18 15.314 15.314 18 12 18ZM12 16C14.209 16 16 14.209 16 12C16 9.791 14.209 8 12 8C9.791 8 8 9.791 8 12C8 14.209 9.791 16 12 16ZM11 1H13V4H11V1ZM11 20H13V23H11V20ZM3.515 4.929L4.929 3.515L7.05 5.636L5.636 7.05L3.515 4.929ZM16.95 18.364L18.364 16.95L20.485 19.071L19.071 20.485L16.95 18.364ZM19.071 3.515L20.485 4.929L18.364 7.05L16.95 5.636L19.071 3.515ZM5.636 16.95L7.05 18.364L4.929 20.485L3.515 19.071L5.636 16.95ZM23 11V13H20V11H23ZM4 11V13H1V11H4Z"/></svg>
            <svg class="moon-icon" viewBox="0 0 24 24"><path d="M10 7C10 10.866 13.134 14 17 14C18.9584 14 20.729 13.1957 21.9995 11.8995C22 11.933 22 11.9665 22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C12.0335 2 12.067 2 12.1005 2.00049C10.8043 3.27098 10 5.04157 10 7ZM4 12C4 16.4183 7.58172 20 12 20C15.0583 20 17.7158 18.2839 19.062 15.7621C18.3941 15.9199 17.7027 16 17 16C12.0294 16 8 11.9706 8 7C8 6.29727 8.08009 5.60587 8.2379 4.93798C5.71611 6.28423 4 8.94168 4 12Z"/></svg>
        </div>
    </div>

    <div class="wrapper">
        <div class="error-code">4<span>0</span>4</div>
        <h1 class="error-title">// Page not found</h1>
        <p class="error-desc">
            Запрошенный путь не существует или был перемещён.<br>
            Проверьте URL или вернитесь на главную.
        </p>
        
        <div class="error-nav">
            <a href="https://dyrty11.github.io/dyrty_11.github.io/index.html" class="btn btn-primary">На главную</a>
            <a href="https://dyrty11.github.io/dyrty_11.github.io/projects.html" class="btn">Проекты</a>
        </div>
        
        <div class="error-grid animated-dashed">
            <a href="https://dyrty11.github.io/dyrty_11.github.io/index.html">
                <span class="grid-label">Раздел</span>
                <span class="grid-path">/index.html</span>
            </a>
            <a href="https://dyrty11.github.io/dyrty_11.github.io/projects.html">
                <span class="grid-label">Раздел</span>
                <span class="grid-path">/projects.html</span>
            </a>
            <a href="https://dyrty11.github.io/dyrty_11.github.io/services.html">
                <span class="grid-label">Раздел</span>
                <span class="grid-path">/services.html</span>
            </a>
            <a href="https://dyrty11.github.io/dyrty_11.github.io/contacts.html">
                <span class="grid-label">Раздел</span>
                <span class="grid-path">/contacts.html</span>
            </a>
        </div>
        
        <div class="error-hint">error_code = 404 · not_found</div>
    </div>

    <!-- Абсолютный путь для скрипта тумблера -->
    <script src="/dyrty_11.github.io/404.js" defer></script>
</body>
</html>
